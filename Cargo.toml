[workspace]
resolver = "3"
members = ["colorz-core", "colorz"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/partty/Colorz"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", default-features = false, features = ["v4"] }
tempfile = "3"
gtk = { package = "gtk4", version = "0.11.5", features = ["gnome_50"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_9"] }
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screenshot", "global_shortcuts", "file_chooser", "gtk4"] }
async-channel = "2"
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
image = "0.25"
ksni = { version = "0.3", default-features = false, features = ["async-io"] }
