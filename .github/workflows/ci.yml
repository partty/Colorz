name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build .deb
    # The app targets GNOME 50 (GTK 4.22, libadwaita 1.9), which Ubuntu
    # 26.04 ships; the package depends on the libraries it is built against.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev liblcms2-dev \
            appstream desktop-file-utils

      - name: Validate desktop and AppStream files
        run: |
          desktop-file-validate data/io.github.partty.Colorz.desktop
          appstreamcli validate --no-net data/io.github.partty.Colorz.metainfo.xml

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-deb

      - name: Build .deb
        run: cargo deb -p colorz --locked

      - uses: actions/upload-artifact@v7
        with:
          name: colorz-deb
          path: target/debian/*.deb
          if-no-files-found: error

  snap:
    name: Build snap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Builds snap/snapcraft.yaml in an LXD container on core26.
      - uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        id: snapcraft

      - uses: actions/upload-artifact@v7
        with:
          name: colorz-snap
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error

  windows:
    name: Windows build
    runs-on: windows-2025
    defaults:
      run:
        # MSYS2's UCRT64 shell: GTK 4 and libadwaita come from MSYS2 packages.
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      # The toolchain is MSYS2's own Rust, so it links against the same
      # GTK libraries it is installed next to.
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-lcms2
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-adwaita-icon-theme

      # Runs in the default shell, so it caches the runner's ~/.cargo and target.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release
        run: cargo build --release --locked -p colorz

      - name: Bundle the GTK runtime
        run: |
          stage="$(cygpath -u "$RUNNER_TEMP")/stage"
          windows/bundle.sh target/release/colorz.exe "$stage"
          du -sh "$stage"

      # tr: Windows checkouts may turn Cargo.toml's line endings into CRLF.
      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1 | tr -d '\r')
          [ -n "$version" ] || { echo "No version in Cargo.toml" >&2; exit 1; }
          echo "version=$version" >> "$(cygpath -u "$GITHUB_OUTPUT")"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (Test-Path $iscc) {
            Write-Host "Inno Setup is already installed"
            exit 0
          }
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed ($LASTEXITCODE)" }
          if (-not (Test-Path $iscc)) { throw "$iscc is missing after installing Inno Setup" }

      - name: Build the installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $v = $env:APP_VERSION
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" "/DStageDir=$env:RUNNER_TEMP\stage" "/O$env:RUNNER_TEMP\out" windows\colorz.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          $setup = Get-Item "$env:RUNNER_TEMP\out\colorz-$v-setup-x64.exe"
          Write-Host ("{0}: {1:N1} MB" -f $setup.Name, ($setup.Length / 1MB))

      - uses: actions/upload-artifact@v7
        with:
          name: colorz-windows
          path: ${{ runner.temp }}/out/*.exe
          if-no-files-found: error

      # Installs, launches, reinstalls and uninstalls the installer just
      # built, and saves screenshots of every page and dialog.
      - name: Smoke test the installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: ./windows/smoke.ps1 -Installer "$env:RUNNER_TEMP\out\colorz-$env:APP_VERSION-setup-x64.exe" -OutDir "$env:RUNNER_TEMP\smoke"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: colorz-windows-smoke
          path: ${{ runner.temp }}/smoke
          if-no-files-found: warn

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: colorz-deb
          path: dist

      # A copy with a fixed name gives the README a stable link:
      # releases/latest/download/colorz_amd64.deb
      - name: Add a version-free copy
        run: cp dist/colorz_*_amd64.deb dist/colorz_amd64.deb

      # GitHub's own CLI, so no third-party code runs with write access.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb --generate-notes --verify-tag

  snap-publish:
    name: Publish snap
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [snap, release]
    runs-on: ubuntu-latest
    env:
      # `snapcraft export-login` output, saved as a repository secret.
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: colorz-snap
          path: dist

      - name: Find the snap
        id: find
        run: echo "snap=$(ls dist/*.snap)" >> "$GITHUB_OUTPUT"

      - name: Upload to the Snap Store (stable)
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        with:
          snap: ${{ steps.find.outputs.snap }}
          release: stable

      - name: Note the missing store login
        if: env.SNAPCRAFT_STORE_CREDENTIALS == ''
        run: echo "::warning::SNAPCRAFT_STORE_CREDENTIALS is not set; the snap was not published."

  store-listing:
    name: Update Snap Store listing
    # Release tags, or by hand from the Actions tab on main. A dispatch on
    # a branch (e.g. a Windows test run) must never touch the store.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: snap
    runs-on: ubuntu-latest
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - name: Note the missing store login
        if: env.SNAPCRAFT_STORE_CREDENTIALS == ''
        run: echo "::warning::SNAPCRAFT_STORE_CREDENTIALS is not set; the listing was not updated."

      - uses: actions/checkout@v7
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''

      - uses: actions/download-artifact@v8
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        with:
          name: colorz-snap
          path: dist

      # Title, summary, description, license and icon, from the snap.
      - name: Upload text metadata and icon
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        run: |
          sudo snap install snapcraft --classic
          snapcraft upload-metadata --force dist/*.snap

      # Categories, links, banner and screenshots, from snap/local/store-listing.yaml.
      - name: Upload categories, banner and screenshots
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install craft-store==3.4.0 pyyaml==6.0.3
          "$RUNNER_TEMP/venv/bin/python" snap/local/push-store-listing.py
