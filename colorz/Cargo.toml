[package]
name = "colorz"
description = "Color picker for the GNOME tray, with a color wheel and palettes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
colorz-core = { path = "../colorz-core" }
gtk.workspace = true
adw.workspace = true
async-channel.workspace = true
dirs.workspace = true
futures-util.workspace = true
image.workspace = true

[target.'cfg(not(windows))'.dependencies]
ashpd.workspace = true
ksni.workspace = true

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8.1"
tray-icon = { version = "0.26.1", default-features = false }
windows-registry = "0.100.0"
windows-sys = { version = "0.61", features = [
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
glib-build-tools = "0.22"

[dev-dependencies]
tempfile.workspace = true

# `cargo deb -p colorz` (see `make deb`) builds the Debian package.
[package.metadata.deb]
maintainer = "Ogi Tsonev <1656661+partty@users.noreply.github.com>"
copyright = "2026 Ogi Tsonev"
section = "graphics"
# Software centers show this for a downloaded .deb (Markdown is rendered).
extended-description = '''
Colorz is a color picker that lives in the GNOME top bar. Pick any pixel on
screen with a global shortcut, copy it in the format you need, fine-tune it on
a color wheel, and collect it into named palettes.

Picking and copying:

- Pick from any app through the desktop portal, from a shortcut
  (Super+Shift+C), the tray menu or the Pick button.
- Copy as HEX, RGB, HSL, HSV, OKLCH, OKLab or CSS color(), with or without
  the function wrapper.
- Convert on copy to Display P3, Adobe RGB or a custom ICC profile, with a
  warning for out-of-gamut colors.
- Paste any CSS color to load it, and keep a history of recent picks.

Color wheel:

- Ring, OKLCH and OKHSL wheels with per-channel sliders and keyboard
  nudging.
- Complementary, analogous, triad and split-complementary harmonies, each
  color ready to copy and to add to a palette.

Palettes:

- Named palettes with labels and CSS variable names, added to in one click
  from the Pick and Wheel tabs.
- Edit a palette color on the wheel or replace it with a new pick, with
  undo.
- Import and export CSS variables and GIMP palettes, or extract a palette
  from an image.

The tray icon needs the AppIndicator extension, which Ubuntu enables by
default. Screenshots and source: https://github.com/partty/Colorz'''
depends = "$auto"
recommends = "xdg-desktop-portal-gnome, gnome-shell-extension-appindicator"
assets = [
    ["target/release/colorz", "usr/bin/", "755"],
    ["../data/io.github.partty.Colorz.desktop", "usr/share/applications/", "644"],
    ["../data/io.github.partty.Colorz.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../data/io.github.partty.Colorz.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../README.md", "usr/share/doc/colorz/", "644"],
]
